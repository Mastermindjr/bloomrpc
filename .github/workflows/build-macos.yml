name: Build macOS (Apple Silicon + Intel)

on:
  workflow_dispatch:
  push:
    branches: [apple-silicon]

jobs:
  build:
    # macos-latest runners are Apple Silicon (arm64) since macos-14
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          yarn install --ignore-engines --network-timeout 600000 2>&1 | tee install.log || {
            echo "::error title=yarn install failed::node $(node -v), yarn $(yarn -v)"
            tail -n 9 install.log | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }

      - name: Build bundles
        run: yarn build

      - name: Package for macOS (arm64 + x64)
        run: npx electron-builder build --mac --publish never
        env:
          # No Apple certificates in CI: skip identity lookup, the
          # afterSign hook (internals/scripts/MacAdhocSign.js) applies an
          # ad-hoc signature so the arm64 build can launch.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BloomRPC-macOS
          path: |
            release/*.dmg
            release/*.zip
